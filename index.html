<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tembea Kenya</title>
    <script>
        // Local Storage for packing checklist and itinerary
        function saveChecklist() {
            const checklist = document.getElementById('packingChecklist').value;
            localStorage.setItem('packingChecklist', checklist);
        }

        function loadChecklist() {
            const checklist = localStorage.getItem('packingChecklist');
            if (checklist) {
                document.getElementById('packingChecklist').value = checklist;
            }
        }

        function saveItinerary() {
            const itinerary = document.getElementById('itineraryBuilder').value;
            localStorage.setItem('itinerary', itinerary);
        }

        function loadItinerary() {
            const itinerary = localStorage.getItem('itinerary');
            if (itinerary) {
                document.getElementById('itineraryBuilder').value = itinerary;
            }
        }

        window.onload = function() {
            loadChecklist();
            loadItinerary();
        };
    </script>
</head>
<body>
    <header>
        <h1>Welcome to Tembea Kenya</h1>
    </header>
    <main>
        <section id="popular-destinations">
            <h2>Popular Destinations</h2>
            <ul>
                <li>Nairobi</li>
                <li>Maasai Mara</li>
                <li>Lake Nakuru</li>
            </ul>
        </section>

        <section id="working-destinations">
            <h2>Working Destinations Form</h2>
            <form action="#">
                <label for="destination">Destination:</label>
                <input type="text" id="destination" name="destination" required>
                <input type="submit" value="Submit">
            </form>
        </section>

        <section id="travel-tools">
            <h2>Travel Tools</h2>
            <h3>Packing Checklist</h3>
            <textarea id="packingChecklist" rows="10" cols="50"></textarea>
            <button onclick="saveChecklist()">Save Checklist</button>

            <h3>Itinerary Builder</h3>
            <textarea id="itineraryBuilder" rows="10" cols="50"></textarea>
            <button onclick="saveItinerary()">Save Itinerary</button>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Tembea Kenya</p>
    </footer>
</body>
</html>
