<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tembea Kenya - Travel Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        a:hover {
            color: #166534;
        }
    </style>
</head>
<body class="bg-gray-50">
    <header class="bg-green-700 text-white py-6">
        <div class="max-w-4xl mx-auto px-6">
            <h1 class="text-4xl font-bold">Tembea Kenya</h1>
            <p class="text-green-100">Explore the Beauty of Kenya</p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto py-12">
        <!-- Plan Your Dream Trip Section -->
        <section class="p-6">
            <h2 class="text-3xl font-bold mb-2">Plan Your Dream Trip</h2>
            <p class="text-gray-600 mb-6">Use this planner to organize destinations you'd like to visit across Kenya.</p>

            <form class="bg-white shadow p-6 rounded-2xl space-y-4">
                <label class="block">
                    <span class="block text-sm font-semibold">Destination</span>
                    <input type="text" class="mt-1 w-full border rounded-md p-2" placeholder="e.g. Maasai Mara" />
                </label>
                <label class="block">
                    <span class="block text-sm font-semibold">Travel Dates</span>
                    <input type="date" class="mt-1 w-full border rounded-md p-2" />
                </label>
                <button class="bg-green-700 text-white px-4 py-2 rounded-md hover:bg-green-800">Add to Plan</button>
            </form>
        </section>

        <!-- Travel Toolkit Section -->
        <section class="p-6">
            <h2 class="text-3xl font-bold mb-6">Travel Toolkit</h2>

            <div class="grid md:grid-cols-2 gap-6">
                <div class="bg-gradient-to-br from-blue-500 to-blue-600 p-6 rounded-2xl text-white shadow">
                    <h3 class="font-bold text-xl mb-2">Weather</h3>
                    <p>24°C, clear skies — Nairobi</p>
                </div>

                <div class="bg-white p-6 rounded-2xl border shadow">
                    <h3 class="font-bold text-xl mb-2">Currency Converter</h3>
                    <p>1 USD ≈ 130.50 KES (static rate)</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="max-w-4xl mx-auto px-6 text-center">
            <p>&copy; 2026 Tembea Kenya. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
